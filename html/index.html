<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏州科技大学校园活动平台</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>

<header class="top-nav">
    <a href="../html/index.html" class="brand">
        <div class="brand-icon">苏</div>
        苏科大活动
    </a>
    <div class="nav-links">
        <a href="../html/index.html" class="active">首页</a>
        <a href="../html/publish.html">发布活动</a>
    </div>
    <div class="user-area">
        <a href="../html/login.html" class="btn btn-ghost btn-sm">登录</a>
        <a href="../html/register.html" class="btn btn-primary btn-sm">注册</a>
    </div>
</header>

<main class="page-container">

    <section style="text-align:center; padding:56px 20px 36px;">
        <div style="display:inline-block; padding:6px 14px; border-radius:999px; background:#f1f5ff; color:#4f6ef7; font-size:13px; margin-bottom:18px;">
            苏州科技大学 · 校内公益平台
        </div>
        <h1 style="font-size:34px; line-height:1.3; margin:0 0 14px;">苏科大同学自己的活动平台</h1>
        <p style="font-size:16px; color:var(--gray-500); max-width:640px; margin:0 auto 26px;">
            面向苏州科技大学全体学生，免费发布、免费参与石湖校区及校内的讲座、比赛、社团与志愿活动，签到后可评价，帮你找到靠谱的校园活动。
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a href="../html/home.html" class="btn btn-primary btn-lg">进入活动大厅</a>
            <a href="../html/register.html" class="btn btn-outline btn-lg">注册账号</a>
        </div>
    </section>

    <section style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:18px; padding:12px 0 48px;">
        <div class="card" style="padding:24px;">
            <h3 style="margin:0 0 8px;">全部免费 · 有学时</h3>
            <p style="color:var(--gray-500); font-size:14px; margin:0;">报名不收费，完成签到还能获得第二课堂学时奖励。</p>
        </div>
        <div class="card" style="padding:24px;">
            <h3 style="margin:0 0 8px;">校内活动</h3>
            <p style="color:var(--gray-500); font-size:14px; margin:0;">只收录苏州科技大学的活动，地点精确到石湖校区楼栋教室。</p>
        </div>
        <div class="card" style="padding:24px;">
            <h3 style="margin:0 0 8px;">签到评价</h3>
            <p style="color:var(--gray-500); font-size:14px; margin:0;">现场签到后才能评分，评价来自真正到场的同学。</p>
        </div>
    </section>

</main>

<footer>
    <small>Copyright &copy; 2026 苏州科技大学校园活动平台 · 校内公益免费</small>
</footer>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏科大活动 - 注册</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

<header class="top-nav">
    <a href="../html/index.html" class="brand">
        <div class="brand-icon">苏</div>
        苏科大活动
    </a>
    <div class="nav-links">
        <a href="../html/index.html">首页</a>
    </div>
    <div class="user-area">
        <a href="../html/login.html" class="btn btn-outline btn-sm">登录</a>
    </div>
</header>

<main>
    <div class="register-card">
        <div class="register-header">
            <h1>加入苏科大活动</h1>
            <p class="subtitle">苏州科技大学学生专属，免费参与校内活动</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" placeholder="4~16位字母、数字或下划线" name="account" id="account" required>
                <div id="accountErr" class="form-error" hidden>账号需为4~16位字母、数字或下划线</div>
            </div>

            <div class="form-group" id="nicknameGroup">
                <label class="form-label">昵称</label>
                <input type="text" class="form-input" placeholder="给自己取个名字" name="nickname" id="nickname" required>
            </div>

            <div class="form-group">
                <label class="form-label">身份</label>
                <select class="form-input" id="userType" name="userType">
                    <option value="student">学生</option>
                    <option value="teacher">老师</option>
                </select>
                <div class="form-hint">老师可以发布活动，学生可以报名参加并累计学时</div>
            </div>

            <div class="form-group" id="teacherNoGroup" style="display:none">
                <label class="form-label">老师工号</label>
                <input type="text" class="form-input" id="teacherNo" placeholder="请输入老师工号">
                <div class="form-error" id="teacherNoErr" hidden>请填写老师工号</div>
            </div>

            <div class="form-group" id="collegeGroup" style="display:none">
                <label class="form-label">所在学院</label>
                <input type="text" class="form-input" id="college" placeholder="例如：电子与信息工程学院">
                <div class="form-error" id="collegeErr" hidden>请填写所在学院</div>
            </div>

            <div class="form-group">
                <label class="form-label">学校</label>
                <input type="text" class="form-input" value="苏州科技大学" name="school" id="school" readonly required>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" name="password" placeholder="请设置密码" id="password" required>
                <div class="form-hint">长度为8~16个字符，建议包含字母与数字</div>
                <div id="pwdStrength" class="pwd-strength" hidden>
                    <div class="strength-bar"><div id="strengthFill"></div></div>
                    <span id="strengthText"></span>
                </div>
                <div id="pwdErr" class="form-error" hidden>密码需要8~16位</div>
            </div>

            <div class="form-group">
                <label class="form-label">手机号</label>
                <div class="phone-row">
                    <select class="form-input" name="code" id="code" style="width: 120px;">
                        <option value="+86">+86 大陆</option>
                        <option value="+852">+852 香港</option>
                        <option value="+853">+853 澳门</option>
                        <option value="+886">+886 台湾</option>
                    </select>
                    <input type="tel" class="form-input" name="phone" id="phone" placeholder="手机号码" required style="flex:1;">
                </div>
                <div id="phoneErr" class="form-error" hidden>请输入11位手机号码</div>
            </div>

            <label class="agreement">
                <input type="checkbox" name="agree" id="agree" required>
                我已阅读并同意<a href="#">服务协议</a>和<a href="#">隐私保护指引</a>
            </label>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" disabled>立即注册</button>

            <div class="login-link">
                <span>已有账号？</span>
                <a href="../html/login.html">去登录</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <small>Copyright &copy; 2026 苏州科技大学校园活动平台 · 校内公益免费</small>
</footer>

<script src="../js/register.js"></script>

</html>

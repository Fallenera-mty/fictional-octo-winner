<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苏科大活动 - 登录</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<header class="top-nav">
    <a href="../html/index.html" class="brand">
        <div class="brand-icon">苏</div>
        苏科大活动
    </a>
    <div class="nav-links">
        <a href="../html/index.html">首页</a>
    </div>
    <div class="user-area">
        <a href="../html/register.html" class="btn btn-outline btn-sm">注册</a>
    </div>
</header>

<main>
    <div class="login-card">
        <div class="login-header">
            <h1>欢迎回来</h1>
            <p class="subtitle">苏州科技大学学生专属的免费活动平台</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" placeholder="手机号 / 邮箱" name="account" id="account" required>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" name="password" placeholder="请输入密码" id="password" required>
                <div id="pwdErr" class="form-error" hidden>请输入密码</div>
            </div>

            <div class="login-options">
                <label class="remember">
                    <input type="checkbox" name="remember" id="remember">
                    记住账号
                </label>
                <a href="#" class="forgot">找回密码</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn" disabled>登录</button>

            <div class="register-link">
                <span>还没有账号？</span>
                <a href="../html/register.html">立即注册</a>
            </div>
        </form>
    </div>
</main>

<footer>
    <small>Copyright &copy; 2025 校园活动平台 All Rights Reserved.</small>
</footer>

<script src="../js/login.js"></script>

</html>
